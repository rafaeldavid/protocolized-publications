<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Every node and every edge of how work moves is now AI-mediated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:             #fafafa;
      --surface:        #f5f5f7;
      --border:         #e5e5e7;
      --border-soft:    #ececef;
      --text:           #1a1a2e;
      --text-secondary: #6b6b7b;
      --text-tertiary:  #9b9ba8;
      --accent:         #a888bf;
      --accent-light:   #f3eef7;
      --accent-dark:    #7d5a96;

      --font-mono:      'Roboto Mono', monospace;
      --font-sans:      'Inter', system-ui, -apple-system, sans-serif;

      --fs-display-3: 20pt;
      --fs-heading-2: 13pt;
      --fs-caption:   8pt;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 24px 0 48px;
      display: flex;
      justify-content: center;
    }

    /* ─── Slide canvas ───────────────────────────────────────── */
    .slide {
      width: 11in;
      height: 8.5in;
      background: #fff;
      box-shadow: 0 4px 24px rgba(26, 26, 46, 0.10);
      padding: 0.55in 0.7in;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .slide-header {
      margin-bottom: 0.16in;
      padding-bottom: 6pt;
      border-bottom: 1px solid var(--border-soft);
    }
    .slide-header-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }
    .slide-header-pill::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      transform: translateY(-1px);
    }

    .slide-h1 {
      font-family: var(--font-mono);
      font-size: var(--fs-display-3);
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.15;
      margin: 0.05in 0 0.18in;
      text-wrap: balance;
      max-width: 9.5in;
      padding-bottom: 10pt;
      border-bottom: 1px solid var(--border-soft);
    }

    .slide-page {
      position: absolute;
      bottom: 0.4in;
      right: 0.7in;
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.06em;
    }

    /* ─── Flow diagram ───────────────────────────────────── */
    .slide-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .flow-svg {
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      height: auto;
    }

    /* SVG styles */
    .svg-node-rect {
      fill: #fff;
      stroke: var(--border);
      stroke-width: 1;
    }
    .svg-person-rect {
      fill: var(--surface);
      stroke: var(--text-tertiary);
    }
    .svg-agent-rect {
      fill: var(--accent-dark);
      stroke: var(--accent-dark);
    }
    .svg-service-rect {
      fill: var(--text);
      stroke: var(--text);
    }
    .svg-node-text {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      fill: var(--text);
      text-anchor: middle;
    }
    .svg-edge-text {
      font-family: var(--font-sans);
      font-size: 11px;
      fill: var(--text-secondary);
      text-anchor: middle;
    }
    .svg-light-text { fill: #fff; }
    .svg-edge {
      stroke: var(--accent);
      stroke-width: 1.5;
      fill: none;
    }
    .svg-role-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: var(--text-tertiary);
      text-anchor: middle;
    }
    .svg-role-label-light { fill: rgba(255,255,255,0.65); }

    /* AI badge: small pill anchored at the top-right corner of each
       non-agent node, to show AI is in every component, not just the
       agent layer. */
    .svg-ai-badge rect {
      fill: var(--accent-dark);
      stroke: #fff;
      stroke-width: 1.5;
    }
    .svg-ai-badge text {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: #fff;
      text-anchor: middle;
    }

    /* Annotations: light gray italic notes explaining how AI is
       involved at each component. Mirror is implicit: each note
       covers a different role (community / person / service /
       agent / web) so the reader sees the full picture once. */
    .svg-annotation {
      font-family: var(--font-sans);
      font-size: 10px;
      font-style: italic;
      fill: var(--text-tertiary);
      text-anchor: middle;
    }

  </style>
</head>
<body>

<section class="slide">
  <header class="slide-header">
    <span class="slide-header-pill">Chapter 1 · More than a tool</span>
  </header>

  <h2 class="slide-h1">Every node and every edge of how work moves is now AI-mediated</h2>

  <main class="slide-body">

    <svg class="flow-svg" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">

      <!-- ─── Edges (drawn first, behind nodes) ─── -->
      <!-- Alice's context fork: community + web → Alice -->
      <line class="svg-edge" x1="110" y1="100" x2="130" y2="180"/>
      <line class="svg-edge" x1="110" y1="260" x2="130" y2="180"/>
      <!-- Alice → Alice's agent → Service -->
      <line class="svg-edge" x1="230" y1="180" x2="250" y2="180"/>
      <line class="svg-edge" x1="360" y1="180" x2="380" y2="180"/>
      <!-- Service → Bob's agent → Bob -->
      <line class="svg-edge" x1="510" y1="180" x2="530" y2="180"/>
      <line class="svg-edge" x1="640" y1="180" x2="660" y2="180"/>
      <!-- Bob → Bob's context fork -->
      <line class="svg-edge" x1="760" y1="180" x2="780" y2="100"/>
      <line class="svg-edge" x1="760" y1="180" x2="780" y2="260"/>

      <!-- ─── Alice's context (community + web stacked at far left) ─── -->
      <rect class="svg-node-rect" x="10" y="78" width="100" height="44" rx="4"/>
      <text class="svg-node-text" x="60" y="96">Alice's</text>
      <text class="svg-node-text" x="60" y="112">community</text>
      <g class="svg-ai-badge" transform="translate(97, 71)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <rect class="svg-node-rect" x="10" y="238" width="100" height="44" rx="4"/>
      <text class="svg-node-text" x="60" y="256">Alice's</text>
      <text class="svg-node-text" x="60" y="272">web</text>
      <g class="svg-ai-badge" transform="translate(97, 231)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <!-- ─── Alice ─── -->
      <rect class="svg-node-rect svg-person-rect" x="130" y="148" width="100" height="64" rx="4"/>
      <text class="svg-role-label" x="180" y="166">Person</text>
      <text class="svg-node-text" x="180" y="190">Alice</text>
      <g class="svg-ai-badge" transform="translate(217, 141)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <!-- ─── Alice's AI agent ─── -->
      <rect class="svg-node-rect svg-agent-rect" x="250" y="148" width="110" height="64" rx="4"/>
      <text class="svg-role-label svg-role-label-light" x="305" y="166">AI agent</text>
      <text class="svg-node-text svg-light-text" x="305" y="190">Alice's</text>

      <!-- ─── Computer services (center channel) ─── -->
      <rect class="svg-node-rect svg-service-rect" x="380" y="135" width="130" height="90" rx="4"/>
      <text class="svg-role-label svg-role-label-light" x="445" y="160">Channel</text>
      <text class="svg-node-text svg-light-text" x="445" y="183">Computer</text>
      <text class="svg-node-text svg-light-text" x="445" y="199">services</text>
      <g class="svg-ai-badge" transform="translate(497, 128)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <!-- ─── Bob's AI agent ─── -->
      <rect class="svg-node-rect svg-agent-rect" x="530" y="148" width="110" height="64" rx="4"/>
      <text class="svg-role-label svg-role-label-light" x="585" y="166">AI agent</text>
      <text class="svg-node-text svg-light-text" x="585" y="190">Bob's</text>

      <!-- ─── Bob ─── -->
      <rect class="svg-node-rect svg-person-rect" x="660" y="148" width="100" height="64" rx="4"/>
      <text class="svg-role-label" x="710" y="166">Person</text>
      <text class="svg-node-text" x="710" y="190">Bob</text>
      <g class="svg-ai-badge" transform="translate(747, 141)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <!-- ─── Bob's context (community + web stacked at far right) ─── -->
      <rect class="svg-node-rect" x="780" y="78" width="100" height="44" rx="4"/>
      <text class="svg-node-text" x="830" y="96">Bob's</text>
      <text class="svg-node-text" x="830" y="112">community</text>
      <g class="svg-ai-badge" transform="translate(867, 71)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <rect class="svg-node-rect" x="780" y="238" width="100" height="44" rx="4"/>
      <text class="svg-node-text" x="830" y="256">Bob's</text>
      <text class="svg-node-text" x="830" y="272">web</text>
      <g class="svg-ai-badge" transform="translate(867, 231)">
        <rect width="26" height="14" rx="7"/>
        <text x="13" y="10">AI</text>
      </g>

      <!-- ─── Annotations (one per AI role, mirror implicit) ─── -->

      <!-- Alice's community — friends/family already use AI services -->
      <text class="svg-annotation" x="60" y="34">
        <tspan x="60">Alice's friends</tspan>
        <tspan x="60" dy="12">and family</tspan>
        <tspan x="60" dy="12">use AI services.</tspan>
      </text>

      <!-- Alice — AI in her thinking -->
      <text class="svg-annotation" x="180" y="237">
        <tspan x="180">She drafts, decides,</tspan>
        <tspan x="180" dy="12">and reasons through AI.</tspan>
      </text>

      <!-- Computer services — AI inside the service -->
      <text class="svg-annotation" x="445" y="253">
        <tspan x="445">AI runs inside the service's</tspan>
        <tspan x="445" dy="12">responses and retrieval.</tspan>
      </text>

      <!-- Bob's agent — AI as proxy -->
      <text class="svg-annotation" x="585" y="111">
        <tspan x="585">His agent integrates requests</tspan>
        <tspan x="585" dy="12">into a tailored workplan.</tspan>
      </text>

      <!-- Bob's web — AI generates what reaches him -->
      <text class="svg-annotation" x="830" y="307">
        <tspan x="830">Search and feeds reach</tspan>
        <tspan x="830" dy="12">him as AI answers.</tspan>
      </text>

    </svg>

  </main>

  <span class="slide-page">preview</span>
</section>

</body>
</html>
