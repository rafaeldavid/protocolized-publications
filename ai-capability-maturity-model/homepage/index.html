<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocolized → Durable AI Adoption</title>
  <meta name="description" content="The Protocolized homepage has moved. Durable AI Adoption is now at ai.protocolized.dev.">
  <meta http-equiv="refresh" content="0; url=https://ai.protocolized.dev/">
  <link rel="canonical" href="https://ai.protocolized.dev/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Protocol Institute">
  <meta property="og:title" content="Durable AI Adoption">
  <meta property="og:description" content="A practical guide to adopting AI across your organization, with case studies, maturity levels, and lessons from the Protocol Institute and other organizations.">
  <meta property="og:url" content="https://ai.protocolized.dev/">
  <meta property="og:image" content="https://ai.protocolized.dev/images/og-cover.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafafa;
      --text: #1a1a2e;
      --text-secondary: #6b6b7b;
      --accent: #a888bf;
      --accent-dark: #7d5a96;
      --accent-light: #f3eef7;
      --font-mono: 'Roboto Mono', monospace;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 480px; }
    .label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    h1 a { color: var(--accent-dark); text-decoration: none; border-bottom: 2px solid var(--accent); }
    p {
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }
    a.cta {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    a.cta:hover { background: var(--accent-dark); }
    .footer-link {
      margin-top: 22px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }
    .footer-link a { color: var(--accent-dark); text-decoration: none; border-bottom: 1px dotted var(--accent); }
    .footer-link a:hover { color: var(--accent); }
  </style>
  <script>
    // JS-based redirect for browsers that ignore meta refresh
    setTimeout(function () {
      window.location.replace('https://ai.protocolized.dev/');
    }, 100);
  </script>
</head>
<body>
  <div class="card">
    <div class="label">The Protocol Institute</div>
    <h1>Durable AI Adoption has moved to <a href="https://ai.protocolized.dev/">ai.protocolized.dev</a></h1>
    <p>Redirecting you now. If the page doesn't load automatically, click below.</p>
    <a class="cta" href="https://ai.protocolized.dev/">Open the guide →</a>
    <div class="footer-link">
      <a href="https://protocol-institute.org/">protocol-institute.org</a>
    </div>
  </div>
</body>
</html>
